<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #2e2e2e;
      --accent: #00e5a0;
      --accent2: #ff6b6b;
      --text: #f0f0f0;
      --text-dim: #888;
      --btn-num: #1e1e1e;
      --btn-op: #1a2a22;
      --btn-eq: #00e5a0;
      --shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(0,229,160,0.04) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(255,107,107,0.04) 0%, transparent 60%);
    }

    .calculator {
      width: 340px;
      background: var(--surface);
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow), 0 0 0 1px rgba(255,255,255,0.03);
      overflow: hidden;
      animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .display {
      padding: 28px 24px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
    }

    .expression {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: var(--text-dim);
      min-height: 18px;
      letter-spacing: 1px;
      transition: all 0.2s;
      word-break: break-all;
      text-align: right;
    }

    .result {
      font-family: 'Share Tech Mono', monospace;
      font-size: 42px;
      color: var(--text);
      letter-spacing: -1px;
      margin-top: 6px;
      transition: all 0.15s ease;
      word-break: break-all;
      text-align: right;
      line-height: 1;
    }

    .result.animate {
      transform: scale(0.96);
      color: var(--accent);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      padding: 1px;
    }

    .btn {
      background: var(--btn-num);
      border: none;
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 400;
      padding: 20px 0;
      cursor: pointer;
      transition: background 0.1s, transform 0.08s, color 0.1s;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.93);
      background: #2a2a2a;
    }

    .btn.op {
      background: var(--btn-op);
      color: var(--accent);
      font-weight: 600;
    }

    .btn.op:active { background: #1f3329; }

    .btn.clear {
      background: #2a1a1a;
      color: var(--accent2);
      font-weight: 600;
    }

    .btn.clear:active { background: #3a2020; }

    .btn.equals {
      background: var(--accent);
      color: #0f0f0f;
      font-weight: 700;
      font-size: 22px;
    }

    .btn.equals:active { background: #00c98c; }

    .btn.zero {
      grid-column: span 2;
    }

    .btn.backspace {
      background: #1e1e1e;
      color: var(--accent2);
    }

    /* ripple */
    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.06);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .btn:hover::after { opacity: 1; }

    .footer {
      text-align: center;
      padding: 12px;
      font-size: 11px;
      color: #333;
      letter-spacing: 1px;
      font-family: 'Share Tech Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="btn clear" onclick="clearAll()">AC</button>
      <button class="btn op" onclick="toggleSign()">+/-</button>
      <button class="btn op" onclick="percentage()">%</button>
      <button class="btn op" onclick="setOp('/')">÷</button>

      <button class="btn" onclick="appendNum('7')">7</button>
      <button class="btn" onclick="appendNum('8')">8</button>
      <button class="btn" onclick="appendNum('9')">9</button>
      <button class="btn op" onclick="setOp('*')">×</button>

      <button class="btn" onclick="appendNum('4')">4</button>
      <button class="btn" onclick="appendNum('5')">5</button>
      <button class="btn" onclick="appendNum('6')">6</button>
      <button class="btn op" onclick="setOp('-')">−</button>

      <button class="btn" onclick="appendNum('1')">1</button>
      <button class="btn" onclick="appendNum('2')">2</button>
      <button class="btn" onclick="appendNum('3')">3</button>
      <button class="btn op" onclick="setOp('+')">+</button>

      <button class="btn zero" onclick="appendNum('0')">0</button>
      <button class="btn" onclick="appendDot()">.</button>
      <button class="btn equals" onclick="calculate()">=</button>
    </div>
    <div class="footer">CALCULATOR v1.0</div>
  </div>

  <script>
    let current = '0';
    let previous = '';
    let operator = null;
    let justCalculated = false;

    const resultEl = document.getElementById('result');
    const expressionEl = document.getElementById('expression');

    function updateDisplay() {
      resultEl.textContent = current.length > 10
        ? parseFloat(current).toExponential(4)
        : current;
      resultEl.style.fontSize = current.length > 8 ? '28px' : '42px';
    }

    function appendNum(num) {
      if (justCalculated) { current = num; justCalculated = false; }
      else if (current === '0') current = num;
      else if (current.length < 12) current += num;
      updateDisplay();
    }

    function appendDot() {
      if (justCalculated) { current = '0.'; justCalculated = false; }
      else if (!current.includes('.')) current += '.';
      updateDisplay();
    }

    function setOp(op) {
      if (operator && !justCalculated) calculate(true);
      previous = current;
      operator = op;
      const opSymbol = { '+': '+', '-': '−', '*': '×', '/': '÷' }[op];
      expressionEl.textContent = `${previous} ${opSymbol}`;
      justCalculated = false;
      current = '0';
      updateDisplay();
    }

    function calculate(silent = false) {
      if (!operator || previous === '') return;
      const a = parseFloat(previous);
      const b = parseFloat(current);
      let res;
      switch (operator) {
        case '+': res = a + b; break;
        case '-': res = a - b; break;
        case '*': res = a * b; break;
        case '/': res = b === 0 ? 'Error' : a / b; break;
      }
      if (!silent) {
        const opSymbol = { '+': '+', '-': '−', '*': '×', '/': '÷' }[operator];
        expressionEl.textContent = `${previous} ${opSymbol} ${current} =`;
        resultEl.classList.add('animate');
        setTimeout(() => resultEl.classList.remove('animate'), 150);
      }
      current = res === 'Error' ? 'Error' : String(parseFloat(res.toFixed(10)));
      operator = null;
      justCalculated = true;
      updateDisplay();
    }

    function clearAll() {
      current = '0'; previous = ''; operator = null; justCalculated = false;
      expressionEl.textContent = '';
      updateDisplay();
    }

    function toggleSign() {
      if (current !== '0' && current !== 'Error')
        current = String(parseFloat(current) * -1);
      updateDisplay();
    }

    function percentage() {
      if (current !== 'Error')
        current = String(parseFloat(current) / 100);
      updateDisplay();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') appendNum(e.key);
      else if (e.key === '.') appendDot();
      else if (e.key === '+') setOp('+');
      else if (e.key === '-') setOp('-');
      else if (e.key === '*') setOp('*');
      else if (e.key === '/') { e.preventDefault(); setOp('/'); }
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Escape') clearAll();
      else if (e.key === 'Backspace') {
        if (current.length > 1) current = current.slice(0, -1);
        else current = '0';
        updateDisplay();
      }
    });
  </script>
</body>
</html>
